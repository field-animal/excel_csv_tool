name: Build Windows EXE

on:  
  push:                # 커밋 후 원격 저장소에 반영되는 이벤트를 의미 (필수)
    branches:
      - main
    paths:
      - '**'           # 1. 일단 전체 경로를 포함
      - '!**.md'       # 2. 모든 .md 파일 제외
      - '!docs/**'     # 3. docs 폴더 하위 제외
      - '**.{png, svg, bmp, gif, jpg}'
jobs:
  build:
    runs-on: windows-latest 

    steps:
    - uses: actions/checkout@v4 # 최신 버전 권장

    - name: Set up Python
      uses: actions/setup-python@v5 # 최신 버전 권장
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas openpyxl pyinstaller 

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name "ExcelCSVTool" Excel_CSV_Tool.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExcelCSVTool-EXE
        # path는 pyinstaller의 --name 옵션으로 지정한 파일명과 일치
        path: dist/ExcelCSVTool.exe
