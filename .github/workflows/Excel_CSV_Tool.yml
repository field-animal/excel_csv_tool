name: Build Windows EXE

on: [push] # 코드를 올리면 자동으로 빌드 시작

jobs:
  build:
    runs-on: windows-latest # 윈도우 환경에서 빌드

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas openpyxl pyinstaller # 필요한 라이브러리 설치

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name "ExcelCSVTool" Excel_CSV_Tool.py[cite: 1]

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ExcelCSVTool-EXE
        path: dist/ExcelCSVTool.exe
